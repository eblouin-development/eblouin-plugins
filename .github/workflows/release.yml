name: release

# Semver release for the plugin. The version bump itself is NOT made here — it
# is carried by the pull request (see .claude/skills/library-contribution and
# version-bump.yml, which enforces that the PR bumped correctly for its
# release:* label). By the time this runs, main already has the new version.
#
# All this job does is tag the merge commit with the version main now carries,
# so the bump and the tag can never disagree. Nothing pushes to main, so main's
# ruleset ("changes must be made through a pull request") stays absolute — no
# bypass, no App token, no bot commits.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

# Two merges close together would otherwise race on tag creation.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read the version main now carries
        id: version
        run: |
          set -euo pipefail
          v=$(jq -r '.version' plugins/dev-lifecycle/.claude-plugin/plugin.json)
          echo "new=$v" >> "$GITHUB_OUTPUT"
          echo "main is at v$v"

      - name: Tag it
        env:
          NEW: ${{ steps.version.outputs.new }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v$NEW" >/dev/null; then
            echo "::notice::v$NEW is already tagged — this PR carried no bump (docs-only or an out-of-band merge). Nothing to release."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Exact plugin version tag (vX.Y.Z), for reproducibility and pinning.
          git tag "v$NEW"
          git push origin "refs/tags/v$NEW"
          echo "::notice::Released v$NEW"
